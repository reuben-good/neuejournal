<style>
    .images {
        position: relative;
        height: 100%;
        width: 90%;
        display: flex;
    }
    .image-space {
        position: absolute;
        width: 15em;
        height: 17em;
        border-radius: 8px;
        outline: 1px solid #ccc;
        transform-origin: center;
        margin-top: 5vh;
    }
    .image-space.top-left {
        top: 0;
        left: 0;
        transform: rotate(-15deg) translateX(1.5em);
    }
    .image-space.top-right {
        top: 27%;
        right: 0;
        transform: rotate(0deg);
    }
    .image-space.bottom {
        bottom: 5vh;
        left: 10%;
        transform: rotate(15deg);
    }
    .dropspace {
        width: 95%;
        height: 75%;
        position: absolute;
        left: 2.5%;
        top: 2.5%;
        border-radius: 4px;
        outline: 1px dashed #ccc;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        overflow: hidden;
        transition: outline-color 0.2s;
    }
    .dropspace.drag-over {
        outline-color: #666;
        background: rgba(0, 0, 0, 0.03);
    }
    .dropspace > svg {
        fill: #ccc;
        width: 25%;
        height: 25%;
        pointer-events: none;
    }
    .dropspace > img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
        pointer-events: none;
    }
    .dropspace.has-image > svg {
        display: none;
    }
    .dropspace.has-image > img {
        display: block;
    }

    @media (max-width: 600px) {
        .images {
            height: 60%;
            margin-right: 1vw;
            overflow: visible;
        }
        .image-space {
            width: 7.5em;
            height: 8.5em;
        }
    }
</style>

<div class="page-content">
    <div class="images">
        <div class="image-space top-left">
            <div class="dropspace" data-slot="0">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                    <path
                        d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"
                    ></path>
                </svg>
                <img alt="preview" />
            </div>
        </div>
        <div class="image-space top-right">
            <div class="dropspace" data-slot="1">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                    <path
                        d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"
                    ></path>
                </svg>
                <img alt="preview" />
            </div>
        </div>
        <div class="image-space bottom">
            <div class="dropspace" data-slot="2">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                    <path
                        d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"
                    ></path>
                </svg>
                <img alt="preview" />
            </div>
        </div>
    </div>
</div>

<input type="file" id="file-input" accept="image/*" style="display: none" />

<script>
    window.imageSlots = [null, null, null];

    const fileInput = document.getElementById("file-input");
    let activeSlot = null;

    document.querySelectorAll(".dropspace").forEach((el) => {
        const slot = parseInt(el.dataset.slot);

        el.addEventListener("click", () => {
            activeSlot = slot;
            fileInput.click();
        });

        el.addEventListener("dragover", (e) => {
            e.preventDefault();
            el.classList.add("drag-over");
        });
        el.addEventListener("dragleave", () =>
            el.classList.remove("drag-over"),
        );
        el.addEventListener("drop", (e) => {
            e.preventDefault();
            el.classList.remove("drag-over");
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith("image/")) {
                assignFile(slot, file, el);
            }
        });
    });

    fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (file && activeSlot !== null) {
            const el = document.querySelector(
                `.dropspace[data-slot="${activeSlot}"]`,
            );
            assignFile(activeSlot, file, el);
        }
        fileInput.value = "";
    });

    function assignFile(slot, file, el) {
        window.imageSlots[slot] = file;
        const preview = el.querySelector("img");
        preview.src = URL.createObjectURL(file);
        el.classList.add("has-image");
    }
</script>
