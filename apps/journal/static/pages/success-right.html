<div class="page-content">
    <div class="success-info">
        <h3>What's Next?</h3>
        <ul>
            <li>Review your past entries</li>
            <li>Reflect on your progress</li>
            <li>Continue building your journal</li>
        </ul>
        <button id="return-to-form" class="action-btn">
            Write Again
        </button>
    </div>
</div>

<script>
(function() {
  const returnBtn = document.getElementById('return-to-form');
  if (returnBtn) {
    returnBtn.addEventListener('click', async () => {
      if (window.pageManager) {
        // Go back to the form page (index 0)
        await window.pageManager.goToPage(0);
      }
    });
  }
})();
</script>
