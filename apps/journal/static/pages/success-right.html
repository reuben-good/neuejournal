<div class="page-content">
    <div class="success-info">
        <h3>What's Next?</h3>
        <ul>
            <li>Review previous months' positivity</li>
            <li>Take a break from the screen</li>
            <li>Continue building your journal</li>
        </ul>
        <button id="return-to-form" class="action-btn">Record another moment</button>
    </div>
</div>

<script>
    (function () {
        const returnBtn = document.getElementById("return-to-form");
        if (returnBtn) {
            returnBtn.addEventListener("click", async () => {
                if (window.pageManager) {
                    await window.pageManager.previousPage();
                }
            });
        }
    })();
</script>
