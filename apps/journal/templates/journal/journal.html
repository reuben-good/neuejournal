{% load static %}

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Journal</title>
        <link rel="stylesheet" href="{% static 'styles/global.css' %}" />
        <link rel="stylesheet" href="{% static 'styles/journal.css' %}" />
    </head>
    <body>
        <div id="journal">
            <div class="page" id="left-page">
                <div class="page-content"></div>
            </div>
            <div class="page" id="right-page">
                <div class="page-content"></div>
            </div>
            <div id="binder">
                <div class="punches" id="left-punches">
                    <div class="punch"></div>
                    <div class="punch"></div>
                    <div class="punch"></div>
                </div>
                <div class="punches" id="right-punches">
                    <div class="punch"></div>
                    <div class="punch"></div>
                    <div class="punch"></div>
                </div>
                <div class="binder-ring"></div>
                <div class="binder-ring"></div>
                <div class="binder-ring"></div>
            </div>
        </div>

        <script src="{% static 'scripts/pageManager.js' %}"></script>
        <script src="{% static 'scripts/journal.js' %}"></script>
        <script>
            // Initialize the page manager
            document.addEventListener("DOMContentLoaded", async function () {
                // Create page manager instance
                const pageManager = new PageManager();
                window.pageManager = pageManager;

                // Define page pairs
                // You can mix static pages and dynamic Django template endpoints
                const pagePairs = [
                    // Example: Dynamic pages from Django template endpoints
                    {
                        leftUrl:
                            "{% url 'journal:page-entry-list' year=2026 month=4 %}",
                        rightUrl:
                            "{% url 'journal:page-entry-list' year=2026 month=3 %}",
                    },
                    // Example: Static pages from /static/pages/
                    { left: "entry-form", right: "image-upload" },
                ];

                // Load pages
                // If using all static pages, use:
                // await pageManager.loadPages(pagePairs, "/static/pages/");
                // If using dynamic pages, use the custom basePath or omit it:
                await pageManager.loadPages(pagePairs);

                document.addEventListener("pagechange", (e) => {
                    console.log("Page changed to:", e.detail.currentIndex);
                });

                document.addEventListener("keydown", (e) => {
                    if (e.key === "ArrowRight" && pageManager.hasNextPage()) {
                        pageManager.nextPage();
                    } else if (
                        e.key === "ArrowLeft" &&
                        pageManager.hasPreviousPage()
                    ) {
                        pageManager.previousPage();
                    }
                });

                // Example: Refresh the current page's dynamic content
                // pageManager.refreshPage(pageManager.getCurrentPageIndex());
            });
        </script>
    </body>
</html>
