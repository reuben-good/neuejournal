<style>
    .images {
        position: relative;
        height: 100%;
        width: 90%;
        display: flex;
    }
    .image-space {
        position: absolute;
        width: 15em;
        height: 17em;
        border-radius: 8px;
        outline: 1px solid #ccc;
        transform-origin: center;
        margin-top: 5vh;
    }
    .image-space.top-left {
        top: 0;
        left: 0;
        transform: rotate(-15deg) translateX(1.5em);
    }
    .image-space.top-right {
        top: 27%;
        right: 0;
        transform: rotate(0deg);
    }
    .image-space.bottom {
        bottom: 5vh;
        left: 10%;
        transform: rotate(15deg);
    }
    .dropspace {
        width: 95%;
        height: 75%;
        position: absolute;
        left: 2.5%;
        top: 2.5%;
        border-radius: 4px;
        outline: 1px dashed #ccc;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        overflow: hidden;
        transition: outline-color 0.2s;
    }

    .dropspace > img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
    }

    #no-imgs {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 1.5em;
        color: var(--text-secondary);
    }

    @media (max-width: 600px) {
        .images {
            height: 60%;
            margin-right: 1vw;
            overflow: visible;
        }
        .image-space {
            width: 7.5em;
            height: 8.5em;
        }
    }
</style>

<div class="page-content">
    <div class="images">
        {% if urls|length > 0 %}
        <div class="image-space top-left">
            <div class="dropspace">
                <img src="{{ urls|slice:":1"|first }}" alt="" />
            </div>
        </div>
        <div class="image-space top-right">
            <div class="dropspace">
                <img src="{{ urls|slice:"1:2"|first }}" alt="" />
            </div>
        </div>
        <div class="image-space bottom">
            <div class="dropspace">
                <img src="{{ urls|slice:"2:3"|first }}" alt="" />
            </div>
        </div>
        {% else %}
        <p id="no-imgs">No images for this entry</p>
        {% endif %}
    </div>
</div>
